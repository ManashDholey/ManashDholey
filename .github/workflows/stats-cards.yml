name: Update Stats Cards

on:
  schedule:
    - cron: "0 0 * * *"   # regenerates once a day at midnight UTC
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats card
        run: |
          mkdir -p profile
          curl -sf "https://github-readme-stats.vercel.app/api?username=ManashDholey&count_private=true&show_icons=true&theme=react&rank_icon=github&border_radius=10" -o profile/stats.svg

      - name: Fetch top languages card
        run: |
          curl -sf "https://github-readme-stats.vercel.app/api/top-langs/?username=ManashDholey&count_private=true&hide=HTML&langs_count=10&layout=compact&theme=react&border_radius=10&size_weight=0.5&count_weight=0.5&exclude_repo=github-readme-stats" -o profile/top-langs.svg

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/
          git diff --staged --quiet || git commit -m "Update stats cards"
          git push
