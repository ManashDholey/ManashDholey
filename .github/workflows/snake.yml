name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # regenerates once a day at midnight UTC
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake game from a GitHub user contributions grid
        uses: Platane/snk@v3
        with:
          github_user_name: ManashDholey
          outputs: |
            output:github-contribution-grid-snake.svg
            output:github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
